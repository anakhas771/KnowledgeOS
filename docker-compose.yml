services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledgeos_db

    restart: always

    environment:
      POSTGRES_DB: knowledgeos
      POSTGRES_USER: knowledgeos_user
      POSTGRES_PASSWORD: knowledgeos_password

    ports:
      - "5433:5432"

    volumes:
      - knowledgeos_postgres_data:/var/lib/postgresql/data



  redis:

    image: redis:7-alpine

    container_name: knowledgeos_redis

    restart: always

    ports:
      - "6380:6379"

  celery-worker:
    build:
      context: ./backend

    container_name: knowledgeos_celery_worker

    restart: always

    command:
      celery -A config worker -l info

    volumes:
      - ./backend:/app

    environment:
      POSTGRES_DB: knowledgeos
      POSTGRES_USER: knowledgeos_user
      POSTGRES_PASSWORD: knowledgeos_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      - postgres
      - redis

    networks:
      - default

  backend:

    build:
      context: ./backend

    container_name: knowledgeos_backend

    restart: always

    command:
      python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8001:8000"

    environment:

      POSTGRES_DB: knowledgeos

      POSTGRES_USER: knowledgeos_user

      POSTGRES_PASSWORD: knowledgeos_password

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432


    depends_on:

      - postgres

      - redis



volumes:

  knowledgeos_postgres_data: